[package]
name = "boveda-pro"
version = "1.0.0"
description = "Gestor de contraseñas local cifrado"
authors = ["Bóveda Pro"]
edition = "2021"

[lib]
name = "boveda_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
